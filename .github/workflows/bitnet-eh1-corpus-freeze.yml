name: BitNet EH1 Corpus Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned freeze dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'datasets==4.1.1' \
            'tokenizers==0.22.1' \
            'numpy==2.3.3'

      - name: Reproduce frozen corpus, tokenizer, and schedules
        run: python bitnet_eh1/freeze_corpus.py

      - name: Build compact receipt bundle
        run: |
          mkdir -p bitnet_eh1/receipt_bundle
          cp bitnet_eh1/frozen_corpus/source_jsonl/SOURCE_SUBSTITUTION_AMENDMENT.json bitnet_eh1/receipt_bundle/
          cp bitnet_eh1/frozen_corpus/source_jsonl/SOURCE_JSONL_FREEZE_MANIFEST.json bitnet_eh1/receipt_bundle/
          cp bitnet_eh1/frozen_corpus/tokenized/CORPUS_FREEZE_MANIFEST.json bitnet_eh1/receipt_bundle/
          cp bitnet_eh1/frozen_corpus/schedules/BATCH_SCHEDULE_MANIFEST.json bitnet_eh1/receipt_bundle/
          cp bitnet_eh1/frozen_corpus/FREEZE_CLOSEOUT_RECEIPT.json bitnet_eh1/receipt_bundle/
          cp bitnet_eh1/frozen_corpus/tokenized/tokenizer.json bitnet_eh1/receipt_bundle/
          cp bitnet_eh1/frozen_corpus/schedules/*.npy bitnet_eh1/receipt_bundle/
          python --version > bitnet_eh1/receipt_bundle/python_version.txt
          python -m pip freeze | sort > bitnet_eh1/receipt_bundle/pip_freeze.txt

      - name: Upload receipt bundle
        uses: actions/upload-artifact@v4
        with:
          name: bitnet-eh1-architecture-smoke-freeze-receipts
          path: bitnet_eh1/receipt_bundle
          retention-days: 30
          if-no-files-found: error

      - name: Upload frozen corpus artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitnet-eh1-architecture-smoke-frozen-corpus
          path: |
            bitnet_eh1/frozen_corpus/source_jsonl/*.jsonl
            bitnet_eh1/frozen_corpus/tokenized/*.uint16
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
