name: BitNet EH1 Four-Arm Tiny Trainer Smoke

on:
  pull_request:
    branches: [three-paper-suite]
    paths:
      - '.github/workflows/bitnet-eh1-four-arm-tiny-smoke.yml'
      - 'bitnet_eh1/bitnet_energy_head_smoke_core.py'
      - 'bitnet_eh1/run_four_arm_tiny_trainer_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-arm-tiny-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned CPU implementation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1'
          python -m pip install \
            'regex!=2019.12.17' \
            'packaging>=20.0' \
            requests \
            'pyyaml>=5.1' \
            filelock \
            'safetensors>=0.4.3' \
            'huggingface-hub==0.35.3' \
            'tokenizers==0.21.4'
          python -m pip install --no-deps \
            'https://github.com/huggingface/transformers/archive/096f25ae1f501a084d8ff2dcaf25fbc2bd60eba4.zip'

      - name: Run fail-closed four-arm end-to-end trainer smoke
        working-directory: bitnet_eh1
        run: |
          set +e
          python run_four_arm_tiny_trainer_smoke.py \
            --output BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.json \
            > BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.log 2>&1
          status=$?
          cat BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.log
          if [ ! -f BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.json ]; then
            SMOKE_EXIT_STATUS="$status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path('BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.log')
          text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          receipt = {
              'campaign': 'BITNET_EH1_ARCHITECTURE_SMOKE_V1',
              'smoke_id': 'BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1',
              'scope': 'IMPLEMENTATION_ONLY_NON_VERDICT',
              'verdict': 'FOUR_ARM_TINY_END_TO_END_TRAINER_SMOKE_FAIL_BEFORE_RECEIPT',
              'shell_exit_status': int(os.environ['SMOKE_EXIT_STATUS']),
              'log_tail': text[-12000:],
              'claim_ceiling': 'IMPLEMENTATION FAILURE ONLY; no scientific inference',
          }
          Path('BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True), encoding='utf-8'
          )
          PY
          fi
          exit "$status"

      - name: Upload implementation receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitnet-eh1-four-arm-tiny-trainer-smoke-receipt
          path: |
            bitnet_eh1/BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.json
            bitnet_eh1/BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.log
          if-no-files-found: error
          retention-days: 30
