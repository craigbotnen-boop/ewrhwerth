name: BitNet Gate 010 Native BitLinear Adaptive A4
on:
  push:
    branches: [bitnet-radial-angular-pilot-20260816]
    paths:
      - 'experiments/bitnet_gate010_native_bitlinear_adaptive_a4.py'
      - '.github/workflows/bitnet-gate010-native-bitlinear-adaptive-a4.yml'
  workflow_dispatch:
jobs:
  gate010:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          pip install 'transformers>=4.57.6,<5' 'datasets>=4,<5' 'accelerate>=1.0' sentencepiece
      - name: Run Gate 010
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python experiments/bitnet_gate010_native_bitlinear_adaptive_a4.py
      - name: Upload Gate 010 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate010-results
          path: gate010_results.json
          if-no-files-found: ignore
