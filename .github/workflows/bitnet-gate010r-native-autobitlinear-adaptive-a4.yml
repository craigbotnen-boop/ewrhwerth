name: BitNet Gate 010R Native AutoBitLinear Adaptive A4
on:
  push:
    branches: [bitnet-radial-angular-pilot-20260816]
    paths:
      - 'experiments/bitnet_gate010r_native_autobitlinear_adaptive_a4.py'
      - '.github/workflows/bitnet-gate010r-native-autobitlinear-adaptive-a4.yml'
  workflow_dispatch:
jobs:
  gate010r:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          pip install 'transformers>=4.57.6,<5' 'datasets>=4,<5' 'accelerate>=1.0' sentencepiece
      - name: Run Gate 010R
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          python experiments/bitnet_gate010r_native_autobitlinear_adaptive_a4.py 2>&1 | tee gate010r.log
      - name: Upload Gate 010R receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate010r-results
          path: |
            gate010r_results.json
            gate010r.log
          if-no-files-found: warn
