name: BitNet Gate 010S Outlier Hadamard Diagnostic
on:
  push:
    branches: [bitnet-radial-angular-pilot-20260816]
    paths:
      - 'experiments/bitnet_gate010s_outlier_hadamard_diagnostic.py'
      - '.github/workflows/bitnet-gate010s-outlier-hadamard-diagnostic.yml'
  workflow_dispatch:
jobs:
  gate010s:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          pip install 'transformers>=4.57.6,<5' 'datasets>=4,<5' 'accelerate>=1.0' sentencepiece
      - name: Run Gate 010S
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          python experiments/bitnet_gate010s_outlier_hadamard_diagnostic.py 2>&1 | tee gate010s.log
      - name: Upload Gate 010S receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate010s-results
          path: |
            gate010s_results.json
            gate010s.log
          if-no-files-found: warn
