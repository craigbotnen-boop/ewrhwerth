name: BitNet HF Auth Preflight

on:
  pull_request:
    branches: [three-paper-suite]
    paths: ['.github/workflows/bitnet-hf-auth-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Test authenticated original SlimPajama access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo 'HF_TOKEN_MISSING'; exit 2; }
          python3 -m pip install -q 'datasets==4.1.1'
          python3 - <<'PY'
          import os
          from datasets import load_dataset
          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          dataset_id = 'cerebras/SlimPajama-627B'
          info = HfApi(token=token).dataset_info(dataset_id)
          print('AUTH_REVISION', info.sha)
          for split in ('train', 'validation'):
              ds = load_dataset(
                  dataset_id,
                  split=split,
                  streaming=True,
                  revision=info.sha,
                  token=token,
              )
              row = next(iter(ds))
              print('AUTH_ROW_OK', split, sorted(row.keys()), len(row.get('text', '')))
          print('HF_AUTH_PREFLIGHT_PASS')
          PY
