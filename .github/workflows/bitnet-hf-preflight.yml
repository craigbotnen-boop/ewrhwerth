name: BitNet HF Dataset Preflight

on:
  pull_request:
    branches: [three-paper-suite]
    paths: ['.github/workflows/bitnet-hf-preflight.yml']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install -q 'datasets==4.1.1'
      - name: Resolve and read SlimPajama rows
        run: |
          python - <<'PY'
          import traceback
          from datasets import load_dataset
          from huggingface_hub import HfApi

          dataset_id = 'cerebras/SlimPajama-627B'
          try:
              revision = HfApi().dataset_info(dataset_id).sha
              print('REVISION', revision, flush=True)
              for split in ('train', 'validation'):
                  print('OPEN_SPLIT', split, flush=True)
                  ds = load_dataset(dataset_id, split=split, streaming=True, revision=revision)
                  row = next(iter(ds))
                  print('ROW_OK', split, sorted(row.keys()), type(row.get('text')).__name__, len(row.get('text', '')), flush=True)
              print('HF_PREFLIGHT_PASS', flush=True)
          except Exception as exc:
              print('HF_PREFLIGHT_FAIL', type(exc).__name__, repr(exc), flush=True)
              traceback.print_exc()
              raise
          PY
