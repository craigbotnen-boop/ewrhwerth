name: BitNet Mirror Preflight

on:
  pull_request:
    branches: [three-paper-suite]
    paths: ['.github/workflows/bitnet-mirror-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect pinned SlimPajama reupload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q 'datasets==4.1.1'
          python3 - <<'PY'
          import hashlib, json
          from datasets import load_dataset
          from huggingface_hub import HfApi

          dataset_id='gmongaras/SlimPajama-627B_Reupload'
          revision='c34c22dbb10ae6b264a2f357a909d1a537141b36'
          info=HfApi().dataset_info(dataset_id)
          print('MIRROR_HEAD', info.sha)
          print('PINNED_REVISION', revision)
          for split in ('train','validation'):
              print('OPEN', split)
              ds=load_dataset(dataset_id, split=split, streaming=True, revision=revision)
              h=hashlib.sha256(); first=None; rows=0
              for idx,row in enumerate(ds):
                  if first is None: first=row
                  canon=json.dumps({'text':row.get('text'),'meta':row.get('meta')},ensure_ascii=False,separators=(',',':'),sort_keys=True)
                  h.update(canon.encode('utf-8')); h.update(b'\n')
                  rows += 1
                  if idx == 31: break
              print('ROWS', split, rows)
              print('KEYS', split, sorted(first.keys()) if first else None)
              print('META', split, first.get('meta') if first else None)
              print('TEXT_PREFIX', split, repr((first.get('text','') if first else '')[:120]))
              print('FIRST32_SHA256', split, h.hexdigest())
          print('MIRROR_PREFLIGHT_PASS')
          PY
