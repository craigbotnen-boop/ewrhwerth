name: BitNet Tiny Smoke Artifact Inspect

on:
  pull_request:
    branches: [three-paper-suite]
    paths: ['.github/workflows/bitnet-tiny-smoke-artifact-inspect.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bitnet-eh1-four-arm-tiny-trainer-smoke-receipt
          path: artifact
          run-id: 29463496919
          github-token: ${{ github.token }}
      - name: Print one-line receipt summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifact/BITNET_EH1_FOUR_ARM_TINY_TRAINER_SMOKE_V1.json').read_text())
          fields = [
              'VERDICT=' + r['verdict'],
              'MATCHED_INIT=' + r['matched_initialization_assertions'],
          ]
          for row in r['arm_results']:
              fields.append(
                  'ARM=' + row['arm']
                  + ',UPDATES=' + str(len(row['updates']))
                  + ',FINITE_GRADS=' + str(all(x['grad_norm_preclip_finite'] for x in row['updates']))
                  + ',NONFINITE=' + str(sum(x['total_nonfinite_gradient_values'] for x in row['updates']))
                  + ',DELTA=' + repr(row['parameter_delta_l2'])
                  + ',FINAL_NLL=' + repr(row['final_batch_nll'])
                  + ',FINITE_LOGITS=' + str(row['final_logits_finite'])
              )
          fields.append('EH1_NORMAL_NLL=' + repr(r['eh1_interventions']['normal_nll']))
          for row in r['eh1_interventions']['rows']:
              fields.append(
                  'INT=' + row['mode']
                  + ',DELTA_NLL=' + repr(row['delta_nll_vs_normal'])
                  + ',MAX_LOGIT_DELTA=' + repr(row['max_abs_logit_delta_vs_normal'])
              )
          fields.append('CLAIM=' + r['claim_ceiling'])
          print(' | '.join(fields))
          PY
