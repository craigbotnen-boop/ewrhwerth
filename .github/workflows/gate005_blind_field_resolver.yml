name: Gate005 blind field authority resolver

on:
  pull_request:
    branches: [three-paper-suite]
  push:
    branches: [three-paper-suite]
    paths:
      - '.github/workflows/gate005_blind_field_resolver.yml'

permissions:
  contents: read

jobs:
  resolve-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public Dovekie metadata without rendering it
        run: |
          curl -fsSL \
            'https://raw.githubusercontent.com/des-science/DES-SN5YR/main/4_DISTANCES_COVMAT/DES-Dovekie_Metadata.csv' \
            -o /tmp/DES-Dovekie_Metadata.csv

      - name: Resolve only CID CIDint FIELD for frozen targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {'1264689', '1331707', '1431064'}
          allowed = ('CID', 'CIDint', 'FIELD')
          src = '/tmp/DES-Dovekie_Metadata.csv'
          out = Path('gate005_field_authority.csv')

          def norm_id(x):
              s = '' if x is None else str(x).strip()
              if s.endswith('.0'):
                  s = s[:-2]
              return s

          found = {t: [] for t in targets}
          with open(src, encoding='utf-8-sig', errors='strict') as f:
              header = f.readline().split()
              missing = [name for name in allowed if name not in header]
              if missing:
                  raise SystemExit('Required authority columns absent')
              idx = {name: header.index(name) for name in allowed}

              for line in f:
                  parts = line.split()
                  if len(parts) <= max(idx.values()):
                      raise SystemExit('Malformed metadata row')
                  cid = norm_id(parts[idx['CID']])
                  cidint = norm_id(parts[idx['CIDint']])
                  field = parts[idx['FIELD']].strip()

                  matched = None
                  if cid in targets:
                      matched = cid
                  if cidint in targets:
                      if matched is not None and matched != cidint:
                          raise SystemExit('Ambiguous authority identifier match')
                      matched = cidint
                  if matched is not None:
                      found[matched].append((cid, cidint, field))

          bad = {k: len(v) for k, v in found.items() if len(v) != 1}
          if bad:
              raise SystemExit('Authority extraction failed: missing or non-unique target')

          rows = [(t, *found[t][0]) for t in sorted(targets, key=int)]
          out.write_text(
              'target_id,CID,CIDint,FIELD\n' +
              ''.join(f'{t},{cid},{cidint},{field}\n' for t, cid, cidint, field in rows),
              encoding='utf-8'
          )
          for t, cid, cidint, field in rows:
              print(f'FIELD_AUTHORITY target_id={t} CID={cid} CIDint={cidint} FIELD={field}')
          PY

      - name: Upload blind authority receipt
        uses: actions/upload-artifact@v4
        with:
          name: gate005-field-authority
          path: gate005_field_authority.csv
          if-no-files-found: error
