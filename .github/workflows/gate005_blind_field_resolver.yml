name: Gate005 blind field authority resolver

on:
  pull_request:
    branches: [three-paper-suite]
  push:
    branches: [three-paper-suite]
    paths:
      - '.github/workflows/gate005_blind_field_resolver.yml'

permissions:
  contents: read

jobs:
  resolve-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public Dovekie metadata without rendering it
        run: |
          curl -fsSL \
            'https://raw.githubusercontent.com/des-science/DES-SN5YR/main/4_DISTANCES_COVMAT/DES-Dovekie_Metadata.csv' \
            -o /tmp/DES-Dovekie_Metadata.csv

      - name: Blind probe allowed authority tokens only
        shell: bash
        run: |
          python - <<'PY'
          from itertools import islice

          src = '/tmp/DES-Dovekie_Metadata.csv'
          with open(src, encoding='utf-8-sig', errors='strict') as f:
              for i, line in enumerate(islice(f, 20), 1):
                  u = line.upper()
                  print(
                      'SCHEMA_PROBE '
                      f'line={i} '
                      f'has_CID={"CID" in u} '
                      f'has_CIDINT={"CIDINT" in u} '
                      f'has_FIELD={"FIELD" in u} '
                      f'commas={line.count(",")} '
                      f'tabs={line.count(chr(9))} '
                      f'semicolons={line.count(";")} '
                      f'whitespace_tokens={len(line.split())}'
                  )
          PY
