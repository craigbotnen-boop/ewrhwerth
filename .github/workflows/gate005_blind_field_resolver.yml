name: Gate005 blind field authority resolver

on:
  push:
    branches: [three-paper-suite]
    paths:
      - '.github/workflows/gate005_blind_field_resolver.yml'

permissions:
  contents: read

jobs:
  resolve-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FITS reader
        run: python -m pip install --quiet astropy

      - name: Fetch DES-SN5YR event-header table only
        run: |
          curl -fsSL \
            'https://raw.githubusercontent.com/des-science/DES-SN5YR/main/0_DATA/DES-SN5YR_DES/DES-SN5YR_DES_HEAD.FITS.gz' \
            -o /tmp/DES-SN5YR_DES_HEAD.FITS.gz

      - name: Resolve only SNID and FIELD for frozen targets
        shell: bash
        run: |
          python - <<'PY'
          from astropy.io import fits
          from pathlib import Path

          targets = {'1264689', '1331707', '1431064'}
          src = '/tmp/DES-SN5YR_DES_HEAD.FITS.gz'
          out = Path('gate005_field_authority.csv')

          with fits.open(src, memmap=False) as hdul:
              data = hdul[1].data
              names = set(data.names)
              if not {'SNID', 'FIELD'} <= names:
                  raise SystemExit('Required authority columns absent')

              found = {t: [] for t in targets}
              for row in data:
                  snid = row['SNID']
                  field = row['FIELD']
                  if isinstance(snid, bytes):
                      snid = snid.decode('utf-8', 'strict')
                  if isinstance(field, bytes):
                      field = field.decode('utf-8', 'strict')
                  snid = str(snid).strip()
                  field = str(field).strip()
                  if snid in targets:
                      found[snid].append(field)

          bad = {k: v for k, v in found.items() if len(v) != 1}
          if bad:
              raise SystemExit('Authority extraction failed: missing or non-unique target')

          rows = [(t, found[t][0]) for t in sorted(targets, key=int)]
          out.write_text('target_id,FIELD\n' + ''.join(f'{t},{f}\n' for t, f in rows), encoding='utf-8')
          for t, f in rows:
              print(f'FIELD_AUTHORITY {t} {f}')
          PY

      - name: Upload blind authority receipt
        uses: actions/upload-artifact@v4
        with:
          name: gate005-field-authority
          path: gate005_field_authority.csv
          if-no-files-found: error
