name: Pair-profile n12 degree-bound screens

on:
  push:
    branches:
      - pair-profile-n12-degree-bounds
  workflow_dispatch:

jobs:
  scan:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: maxdeg4
            opts: "-c -D4"
          - label: mindeg7
            opts: "-c -d7"
    steps:
      - uses: actions/checkout@v4
      - name: Install nauty
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nauty
          GENG="$(command -v geng || command -v nauty-geng || true)"
          test -n "$GENG"
          echo "GENG=$GENG" >> "$GITHUB_ENV"
      - name: Build scanner
        shell: bash
        run: |
          g++ -O3 -march=native -std=c++20 tools/pair_profile_disconnected12.cpp -o scan12
      - name: Exhaust degree-bounded family
        shell: bash
        env:
          OPTS: ${{ matrix.opts }}
        run: |
          set +e
          eval "\"$GENG\" -q $OPTS 12" 2>geng.err \
            | ./scan12 p2only 2>scanner.err \
            | tee result.txt
          rc=${PIPESTATUS[1]}
          echo "scanner_rc=$rc" | tee -a result.txt
          cat geng.err
          tail -n 50 scanner.err || true
          exit "$rc"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n12-degree-bound-${{ matrix.label }}
          path: |
            result.txt
            geng.err
            scanner.err

  summarize:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: n12-degree-bound-*
          path: artifacts
      - name: Summarize
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.scan.result }}
        run: |
          echo "PAIR_PROFILE_N12_DEGREE_BOUND_SUMMARY" | tee summary.txt
          echo "matrix_result=$MATRIX_RESULT" | tee -a summary.txt
          grep -RH -E 'P2_COLLISION_FOUND|SCAN_COMPLETE graphs=' artifacts | tee -a summary.txt || true
          if grep -Rq '^P2_COLLISION_FOUND' artifacts; then
            echo "STATUS=P2_COLLISION_FOUND" | tee -a summary.txt
            grep -RH -A4 '^P2_COLLISION_FOUND' artifacts | tee -a summary.txt
          else
            test "$MATRIX_RESULT" = "success"
            echo "STATUS=P2_INJECTIVE_ON_BOTH_DEGREE_BOUND_FAMILIES" | tee -a summary.txt
          fi
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n12-degree-bound-summary
          path: summary.txt
