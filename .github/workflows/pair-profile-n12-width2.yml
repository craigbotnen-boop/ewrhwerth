name: Pair-profile n12 degree-width-2 screens

on:
  push:
    branches:
      - pair-profile-n12-width2
  workflow_dispatch:

jobs:
  scan:
    name: degrees ${{ matrix.lo }}-${{ matrix.hi }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lo: 3, hi: 5}
          - {lo: 4, hi: 6}
          - {lo: 5, hi: 7}
          - {lo: 6, hi: 8}
    steps:
      - uses: actions/checkout@v4
      - name: Install nauty
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nauty
          GENG="$(command -v geng || command -v nauty-geng || true)"
          test -n "$GENG"
          echo "GENG=$GENG" >> "$GITHUB_ENV"
      - name: Build scanner
        shell: bash
        run: |
          g++ -O3 -march=native -std=c++20 tools/pair_profile_disconnected12.cpp -o scan12
      - name: Exhaust family
        shell: bash
        env:
          LO: ${{ matrix.lo }}
          HI: ${{ matrix.hi }}
        run: |
          set +e
          "$GENG" -cq -d"$LO" -D"$HI" 12 2>geng.err \
            | ./scan12 p2only 2>scanner.err \
            | tee result.txt
          rc=${PIPESTATUS[1]}
          echo "scanner_rc=$rc" >> result.txt
          exit "$rc"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n12-width2-${{ matrix.lo }}-${{ matrix.hi }}
          path: |
            result.txt
            scanner.err
            geng.err

  summarize:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: n12-width2-*
          path: artifacts
      - name: Summarize
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.scan.result }}
        run: |
          echo "PAIR_PROFILE_N12_WIDTH2_SUMMARY" | tee summary.txt
          echo "matrix_result=$MATRIX_RESULT" | tee -a summary.txt
          grep -RH -E 'P2_COLLISION_FOUND|SCAN_COMPLETE graphs=' artifacts | tee -a summary.txt || true
          if grep -Rq '^P2_COLLISION_FOUND' artifacts; then
            echo "STATUS=P2_COLLISION_FOUND" | tee -a summary.txt
            grep -RH -A4 '^P2_COLLISION_FOUND' artifacts | tee -a summary.txt
          else
            test "$MATRIX_RESULT" = "success"
            echo "STATUS=P2_INJECTIVE_ON_WIDTH2_CENTRAL_FAMILIES" | tee -a summary.txt
          fi
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n12-width2-summary
          path: summary.txt
