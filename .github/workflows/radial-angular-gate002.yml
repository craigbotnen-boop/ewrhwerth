name: Radial Angular Gate 002 Qwen Replication

on:
  push:
    branches:
      - bitnet-radial-angular-pilot-20260816
    paths:
      - experiments/radial_angular_gate002_qwen.py
      - .github/workflows/radial-angular-gate002.yml
  workflow_dispatch:

jobs:
  gate002:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          pip install 'transformers>=4.46,<5' 'datasets>=3,<5' sentencepiece
      - name: Run Gate 002
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python experiments/radial_angular_gate002_qwen.py
