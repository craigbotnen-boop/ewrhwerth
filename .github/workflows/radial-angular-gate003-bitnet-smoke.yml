name: Radial Angular Gate 003 BitNet CPU Smoke

on:
  push:
    branches: [bitnet-radial-angular-pilot-20260816]
    paths:
      - '.github/workflows/radial-angular-gate003-bitnet-smoke.yml'

jobs:
  gate003-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          pip install 'transformers>=4.57.6,<5' 'datasets>=4,<5' 'accelerate>=1.0' sentencepiece
      - name: Prepare tiny CPU smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/radial_angular_gate003_bitnet.py')
          s=p.read_text()
          s=s.replace('SEQ = 256', 'SEQ = 64')
          s=s.replace('N_CAL = 4', 'N_CAL = 1')
          s=s.replace('N_EVAL = 8', 'N_EVAL = 1')
          s=s.replace('trust_remote_code=True', 'trust_remote_code=False')
          s=s.replace('if not torch.cuda.is_available():\n    raise RuntimeError("Gate 003 requires CUDA")\ndevice = torch.device("cuda")\nprint("CUDA", json.dumps({"name": torch.cuda.get_device_name(0), "torch": torch.__version__}), flush=True)', 'device = torch.device("cpu")\nprint("DEVICE", json.dumps({"name": "cpu", "torch": torch.__version__}), flush=True)')
          s=s.replace('device_map={"": 0}', 'device_map={"": "cpu"}')
          s=s.replace('"quantization_config": getattr(model.config, "quantization_config", None)', '"quantization_config": str(getattr(model.config, "quantization_config", None))')
          Path('/tmp/gate003_smoke.py').write_text(s)
          PY
      - name: Run Gate 003 tiny CPU smoke
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python /tmp/gate003_smoke.py
