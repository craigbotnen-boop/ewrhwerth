name: Radial Angular Gate 004 Radial Codec

on:
  push:
    branches: [bitnet-radial-angular-pilot-20260816]
    paths:
      - '.github/workflows/radial-angular-gate004-codec.yml'

jobs:
  gate004:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          pip install 'transformers>=4.57.6,<5' 'datasets>=4,<5' 'accelerate>=1.0' sentencepiece
      - name: Run Gate 004
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python experiments/radial_angular_gate004_radial_codec.py
