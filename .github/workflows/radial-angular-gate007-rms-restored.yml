name: Radial Angular Gate 007 RMS Restored
on:
  push:
    branches: [bitnet-radial-angular-pilot-20260816]
    paths:
      - 'experiments/radial_angular_gate007_rms_restored.py'
      - '.github/workflows/radial-angular-gate007-rms-restored.yml'
  workflow_dispatch:
jobs:
  gate007:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          pip install 'transformers>=4.57.6,<5' 'datasets>=4,<5' 'accelerate>=1.0' sentencepiece
      - name: Run Gate 007
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python experiments/radial_angular_gate007_rms_restored.py
      - name: Upload Gate 007 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate007-results
          path: gate007_results.json
          if-no-files-found: ignore
