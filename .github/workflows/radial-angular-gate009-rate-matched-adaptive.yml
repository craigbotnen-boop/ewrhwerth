name: Radial Angular Gate 009 Rate Matched Adaptive
on:
  push:
    branches: [bitnet-radial-angular-pilot-20260816]
    paths:
      - 'experiments/radial_angular_gate009_rate_matched_adaptive.py'
      - '.github/workflows/radial-angular-gate009-rate-matched-adaptive.yml'
  workflow_dispatch:
jobs:
  gate009:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          pip install 'transformers>=4.57.6,<5' 'datasets>=4,<5' 'accelerate>=1.0' sentencepiece
      - name: Run Gate 009
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python experiments/radial_angular_gate009_rate_matched_adaptive.py
      - name: Upload Gate 009 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate009-results
          path: gate009_results.json
          if-no-files-found: ignore
