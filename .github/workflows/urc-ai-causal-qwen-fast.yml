name: URC-AI causal patch bridge fast Qwen

on:
  push:
    branches:
      - urc-ai-realmodel-20260927
    paths:
      - ".github/workflows/urc-ai-causal-qwen-fast.yml"
      - "urc_ai_realmodel/causal_patch_bridge_fast.py"

permissions:
  contents: read

jobs:
  qwen-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install dependencies
        run: |
          python -m pip install "transformers==4.57.3" accelerate safetensors sentencepiece scipy pandas scikit-learn
      - name: Run implementation-equivalent Qwen causal bridge
        run: |
          mkdir -p urc_ai_realmodel/causal_results/qwen_fast
          python urc_ai_realmodel/causal_patch_bridge_fast.py \
            --model-key qwen \
            --out urc_ai_realmodel/causal_results/qwen_fast \
            --train-n 192 --test-n 48 --patch-batch 16
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urc-ai-causal-qwen-fast
          path: urc_ai_realmodel/causal_results/qwen_fast
          if-no-files-found: warn
          retention-days: 1
