name: URC-AI contribution transport

on:
  push:
    branches:
      - urc-ai-realmodel-20260927
    paths:
      - ".github/workflows/urc-ai-contribution.yml"
      - "urc_ai_realmodel/contribution_gate.py"

permissions:
  contents: read

jobs:
  contribution:
    strategy:
      fail-fast: false
      matrix:
        model_key: [qwen, pythia]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1

      - name: Install dependencies
        run: |
          python -m pip install "transformers==4.57.3" accelerate safetensors sentencepiece scipy pandas

      - name: Run contribution transport experiment
        run: |
          mkdir -p "urc_ai_realmodel/contribution_results/${{ matrix.model_key }}"
          python urc_ai_realmodel/contribution_gate.py \
            --model-key "${{ matrix.model_key }}" \
            --out "urc_ai_realmodel/contribution_results/${{ matrix.model_key }}"

      - name: Upload compact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urc-ai-contribution-${{ matrix.model_key }}
          path: urc_ai_realmodel/contribution_results/${{ matrix.model_key }}
          if-no-files-found: warn
          retention-days: 1
