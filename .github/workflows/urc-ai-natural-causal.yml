name: URC-AI natural causal scaling

on:
  push:
    branches:
      - urc-ai-realmodel-20260927
    paths:
      - ".github/workflows/urc-ai-natural-causal.yml"
      - "urc_ai_realmodel/natural_causal_extension.py"

permissions:
  contents: read

concurrency:
  group: urc-ai-natural-causal-frozen
  cancel-in-progress: true

jobs:
  natural_causal:
    strategy:
      fail-fast: false
      matrix:
        model_key: [qwen05, pythia, qwen15]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install dependencies
        run: |
          python -m pip install "transformers==4.57.3" accelerate safetensors sentencepiece scipy pandas scikit-learn
      - name: Run natural-language causal replication
        shell: bash
        run: |
          mkdir -p "urc_ai_realmodel/natural_causal/${{ matrix.model_key }}"
          if [ "${{ matrix.model_key }}" = "qwen15" ]; then
            TRAIN=48
            TEST=16
            BATCH=8
          else
            TRAIN=80
            TEST=24
            BATCH=16
          fi
          python urc_ai_realmodel/natural_causal_extension.py \
            --model-key "${{ matrix.model_key }}" \
            --out "urc_ai_realmodel/natural_causal/${{ matrix.model_key }}" \
            --train-pairs "$TRAIN" --test-pairs "$TEST" --patch-batch "$BATCH"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urc-ai-natural-causal-${{ matrix.model_key }}
          path: urc_ai_realmodel/natural_causal/${{ matrix.model_key }}
          if-no-files-found: warn
          retention-days: 1
